# Ngưỡng phát hiện bất thường. Giá trị khởi điểm, cần tinh chỉnh theo mạng thật.
# Mọi số đếm đều tính trên một cửa sổ (window.size_seconds) của một thiết bị.

window:
  size_seconds: 60
  allowed_lateness_seconds: 5      # gói đến trễ tối đa (theo ts) trước khi đóng cửa sổ
  idle_flush_seconds: 90           # không có gói nào trong ngần này giây (giờ thật) thì đóng mọi cửa sổ

alerting:
  min_score: 0.6                   # dưới ngưỡng này không gửi cảnh báo
  cooldown_seconds: 300            # cùng thiết bị + cùng loại trong khoảng này: gộp, không gửi lại
  severity:                        # score >= mức => severity tương ứng; thấp hơn medium là low
    critical: 0.9
    high: 0.8
    medium: 0.7

# Rule: score = 0.7 khi chạm ngưỡng, tăng dần tới 1.0 khi gấp 3 lần ngưỡng
rules:
  port_scan:                       # gửi SYN/UDP tới nhiều port khác nhau trên cùng một đích
    enabled: true
    min_ports_per_target: 100
  host_sweep:                      # dò nhiều máy trên cùng một port (SYN không được trả lời) hoặc ping nhiều máy
    enabled: true
    min_unanswered_targets: 30
    min_icmp_targets: 30
  syn_flood:                       # gửi SYN với tốc độ cao mà hầu như không bắt tay xong
    enabled: true
    min_syn_per_second: 50
    max_completion_ratio: 0.2
  brute_force:                     # thử kết nối lặp lại tới cùng một dịch vụ đăng nhập
    enabled: true
    min_attempts: 20
    ports:
      21: ftp
      22: ssh
      23: telnet
      25: smtp
      110: pop3
      143: imap
      445: smb
      1433: mssql
      3306: mysql
      3389: rdp
      5432: postgresql
      5900: vnc
  dns_tunneling:                   # nhiều subdomain khác nhau, dài/ngẫu nhiên, dưới cùng một domain
    enabled: true
    min_unique_subdomains: 50
    min_avg_entropy: 3.5           # entropy Shannon (bit/ký tự) của phần subdomain
    min_avg_length: 40
  dga:                             # nhiều tên miền không tồn tại (NXDOMAIN) — dấu hiệu malware dò domain C2
    enabled: true
    min_nxdomain: 30
    min_nxdomain_ratio: 0.5
  inbound_scan:                    # một IP bên ngoài dò nhiều port của thiết bị trong LAN
    enabled: true
    min_ports_per_source: 50

arp_spoofing:                      # một IP được khai báo bởi MAC khác với MAC đã biết
  enabled: true
  binding_ttl_seconds: 3600        # MAC cũ hết hiệu lực sau ngần này giây (tránh báo nhầm khi DHCP cấp lại IP)
  score: 0.9

baseline:                          # z-score so với trung bình trượt EWMA của chính thiết bị đó
  enabled: true
  alpha: 0.1                       # trọng số của cửa sổ mới khi cập nhật trung bình
  min_history: 10                  # số cửa sổ tối thiểu trước khi bắt đầu cảnh báo
  z_threshold: 4.0                 # z >= ngưỡng => score 0.6, z >= 2 lần ngưỡng => 1.0
  features:                        # min_value: bỏ qua nếu giá trị tuyệt đối còn nhỏ; min_std: chặn dưới độ lệch chuẩn
    bytes_out:      {category: data_exfiltration,    min_value: 10000000, min_std: 100000}
    packets_out:    {category: traffic_spike,        min_value: 5000,     min_std: 50}
    unique_dst_ips: {category: unusual_destinations, min_value: 50,       min_std: 3}
    new_dst_ips:    {category: unusual_destinations, min_value: 20,       min_std: 3}
    dns_queries:    {category: dns_anomaly,          min_value: 200,      min_std: 5}
